<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">UVIR FT232H shared I2C wiring</title>
  <desc id="desc">AD0 supplies SCL to both modules. AD1 and AD2 are joined as SDA. Both modules share verified 3.3 volt power and ground. This is a logical diagram, not the physical header order.</desc>
  <rect width="1000" height="560" fill="#f7f9fc"/>
  <g font-family="Arial,sans-serif" fill="#172434">
    <text x="40" y="38" font-size="24" font-weight="bold">UVIR · FT232H + AS7331 + AS7343</text>
    <text x="40" y="66" font-size="15">Logical signals only · check actual headers and breakout voltage ratings</text>
    <g fill="#fff" stroke="#67778b" stroke-width="2">
      <rect x="40" y="120" width="260" height="340" rx="14"/>
      <rect x="700" y="90" width="260" height="185" rx="14"/>
      <rect x="700" y="315" width="260" height="185" rx="14"/>
    </g>
    <text x="62" y="153" font-size="21" font-weight="bold">FT232H / MPSSE</text>
    <text x="62" y="182" font-size="14">USB to Android OTG</text>
    <g font-size="16">
      <text x="62" y="216">AD0 / D0 · SCL</text><text x="62" y="256">AD1 / D1 · SDA out</text>
      <text x="62" y="296">AD2 / D2 · SDA in</text><text x="62" y="366">3.3 V regulated</text>
      <text x="62" y="416">GND</text>
    </g>
    <text x="720" y="122" font-size="20" font-weight="bold">UV 5 Click · AS7331</text>
    <text x="720" y="148" font-size="14">I2C 0x74 · default A0/A1 jumpers</text>
    <text x="720" y="347" font-size="20" font-weight="bold">GY-AS734X · AS7343</text>
    <text x="720" y="373" font-size="14">I2C 0x39 · breakout, not bare IC</text>
    <g font-size="15">
      <text x="720" y="177">SCL</text><text x="720" y="205">SDA</text><text x="720" y="233">3V3</text><text x="720" y="261">GND</text>
      <text x="720" y="402">SCL</text><text x="720" y="430">SDA</text><text x="720" y="458">Verified 3V3/VIN input</text><text x="720" y="486">GND</text>
    </g>
    <g fill="none" stroke-width="3" stroke-linejoin="round">
      <path stroke="#9a6a00" d="M300 210H380V170H700 M380 210V395H700"/>
      <path stroke="#1266b0" d="M300 250H425V198H700 M300 290H425V423H700 M425 250V290"/>
      <path stroke="#bd3240" d="M300 360H475V226H700 M475 360V451H700"/>
      <path stroke="#485260" d="M300 410H525V254H700 M525 410V479H700"/>
    </g>
    <g fill="#1266b0"><circle cx="425" cy="250" r="5"/><circle cx="425" cy="290" r="5"/></g>
    <circle cx="380" cy="210" r="5" fill="#9a6a00"/><circle cx="475" cy="360" r="5" fill="#bd3240"/><circle cx="525" cy="410" r="5" fill="#485260"/>
    <text x="332" y="321" font-size="14" fill="#1266b0">Join AD1 + AD2</text>
    <text x="40" y="530" font-size="15">Four shared nets · crossings without dots are not joined · no 5 V logic · ESP32 disconnected</text>
  </g>
</svg>
